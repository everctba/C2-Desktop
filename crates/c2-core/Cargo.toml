[package]
name = "c2-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Nucleo do C2: descoberta, hash e metadados semanticos de projetos"

[dependencies]
ignore.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq.workspace = true

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service: GNOME Keyring/KWallet. Em host sem cofre, use C2_API_KEY.
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
