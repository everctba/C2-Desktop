[package]
name = "c2-desktop"
version = "0.1.0"
description = "C2 Desktop"
edition = "2021"
rust-version = "1.77"

[lib]
name = "c2_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
c2-core = { path = "../../../crates/c2-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"

# Crate proprio: nao entra no workspace Rust do projeto (que compila no GNU).
[workspace]

[features]
console = []
