name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  core:
    name: Core + CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: dependencias Linux (Secret Service)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build release
        run: cargo build --workspace --release
      - name: smoke test (linux)
        if: runner.os == 'Linux'
        run: |
          file ./target/release/c2
          ./target/release/c2 --version
          mkdir -p /tmp/c2-smoke
          printf 'fn main() {}\n' > /tmp/c2-smoke/main.rs
          printf '# doc\n' > /tmp/c2-smoke/README.md
          ./target/release/c2 --root /tmp/c2-smoke init --json
          ./target/release/c2 --root /tmp/c2-smoke status --json
          ./target/release/c2 --root /tmp/c2-smoke reindex --dry-run
          ./target/release/c2 --root /tmp/c2-smoke cleaner
      - name: artefato (CLI Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: c2-cli-linux-x64
          path: target/release/c2
          if-no-files-found: error
      - name: artefato (CLI Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: c2-cli-windows-x64
          path: target/release/c2.exe
          if-no-files-found: error

  desktop:
    name: Desktop (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --manifest-path src-tauri/Cargo.toml

  desktop-linux:
    name: Desktop (ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - name: dependencias do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: dependencias do frontend
        run: pnpm install --frozen-lockfile
      - name: build do desktop (Tauri, sem bundle)
        run: pnpm tauri build --no-bundle
      - name: conferir binario
        run: |
          file src-tauri/target/release/c2-desktop
          ldd src-tauri/target/release/c2-desktop | head -20
      - name: artefato (desktop Linux)
        uses: actions/upload-artifact@v4
        with:
          name: c2-desktop-linux-x64
          path: apps/desktop/src-tauri/target/release/c2-desktop
          if-no-files-found: error
