name: build-linux

# Workflow manual (Run workflow) para gerar os artefatos Linux:
# - CLI `c2` (binario)
# - desktop: .deb e AppImage
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "Bundles do desktop (separados por virgula)"
        required: false
        default: "deb,appimage"
        type: string

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 (CLI + desktop)
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias do sistema (Tauri + Secret Service)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev libdbus-1-dev pkg-config \
            libfuse2 file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Checagens rapidas (fmt + clippy + testes)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Build do CLI (release)
        run: cargo build --workspace --release

      - name: Conferir CLI
        run: |
          file target/release/c2
          ./target/release/c2 --version

      - name: Artefato (CLI Linux)
        uses: actions/upload-artifact@v4
        with:
          name: c2-cli-linux-x64
          path: target/release/c2
          if-no-files-found: error

      - name: Dependencias do frontend
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build do desktop (bundles)
        working-directory: apps/desktop
        env:
          # linuxdeploy/AppImage em runner sem FUSE
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          pnpm tauri build --bundles "${{ inputs.bundles }}"

      - name: Conferir bundles
        run: |
          ls -lh apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          ls -lh apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          file apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Artefato (desktop .deb)
        uses: actions/upload-artifact@v4
        with:
          name: c2-desktop-linux-deb
          path: apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Artefato (desktop AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: c2-desktop-linux-appimage
          path: apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Checksums
        run: |
          sha256sum target/release/c2 > SHA256SUMS.txt
          sha256sum apps/desktop/src-tauri/target/release/bundle/deb/*.deb >> SHA256SUMS.txt
          sha256sum apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Artefato (checksums)
        uses: actions/upload-artifact@v4
        with:
          name: c2-linux-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error
