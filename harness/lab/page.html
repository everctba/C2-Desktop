<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Taskline</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    section { border: 1px solid #ccc; margin: 1rem 0; padding: 1rem; }
    .pricing-card { overflow: hidden; white-space: nowrap; }
  </style>
</head>
<body>
  <header data-c2-block="hero">
    <h1>Taskline</h1>
    <p>Uma lista de tarefas pequena para testar o harness.</p>
  </header>
  <main>
    <section id="features" data-c2-block="features">
      <h2>Recursos</h2>
      <p>Adicionar, listar e concluir tarefas com persistencia local.</p>
    </section>
    <section id="tasks" data-c2-block="tasks">
      <h2>Tarefas</h2>
      <ul>
        <li>[ ] 1 comprar cafe</li>
      </ul>
    </section>
    <section id="pricing" data-c2-block="pricing">
      <h2 class="pricing-card">Plano gratuito para uso local, sem servidor e sem conta, com historico e exportacao.</h2>
    </section>
  </main>
</body>
</html>
